# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "frontend"

[[functions]]
name = "handleSubmit"
source = "src/pages/Login.res"
energy-budget-mj = 10.0
carbon-budget-mg = 2.0

[[functions]]
name = "handleAcknowledge"
source = "src/pages/Alerts.res"
energy-budget-mj = 15.0
carbon-budget-mg = 3.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
